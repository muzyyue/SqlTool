name: Build, Release and Deploy

# 触发条件
on:
  # 推送到分支时触发（含 master 与 v*.*.* 标签）
  push:
    branches: [main, master, rebuild]
    tags: [v*.*.*]
  # PR 只做质量检查（lint + 单元测试），不构建、不发布
  pull_request:
    branches: [main, master, rebuild]
  # 手动触发，可勾选是否同时部署 Pages
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "同时部署到 GitHub Pages"
        required: false
        default: false
        type: boolean

# 环境变量
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # 唯一的构建入口：一次构建，产物供 release 与 deploy 复用
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 质量门禁：lint 与单元测试，失败即中止后续构建与发布
      # 注：不再包含 Prettier 检查。原 build-and-deploy.yml 里的
      # `pnpm run format -- --check` 实际会执行 `prettier --write ... --check`，
      # 其中 --check 被忽略，因此该步骤永远通过；真实的 `prettier --check src/`
      # 当前有约 100 个文件不通过（历史遗留）。要恢复严格检查，应先单独做一次
      # 全量格式化提交，再在此处加回 `prettier --check`。
      - name: Lint
        run: pnpm run lint:check

      - name: Unit tests
        run: pnpm run test:run

      # PR 到此为止：只做 lint 与单测，不构建产物
      - name: Build project
        if: github.event_name != 'pull_request'
        run: pnpm run build:full

      - name: Archive build files
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          zip -r ../dist.zip ./*

      # Release 用 zip 包
      - name: Upload build artifact (zip)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: dist.zip
          retention-days: 30

      # Pages 部署需要目录形态的产物
      - name: Upload build artifact (directory)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 30

  # 发布到 GitHub Releases
  # push 到 main/master 或推送 v*.*.* 标签时无条件发布
  release:
    name: Release to GitHub
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      # 防止重复发布覆盖旧产物
      #
      # 背景：action-gh-release 在 tag 已存在时不会报错，而是把新附件
      # 追加/覆盖到旧 Release 上。若提交时忘记递增 package.json 版本号，
      # 同一个 v1.5.x 会被反复写入，先前版本的 dist.zip 就此丢失。
      #
      # 这里检测 tag 是否已存在：存在则跳过发布并给出警告，不覆盖旧产物，
      # 也不让整个流水线变红（避免纯文档提交因未升版本号而报错）。
      # 若希望改为硬失败，把本步骤的 exit 0 换成 exit 1 即可。
      - name: Check whether tag already exists
        id: tag_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/ref/tags/v${VERSION}")

          case "$status" in
            404)
              # 明确不存在，可以发布
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "标签 v${VERSION} 可用，继续发布"
              ;;
            200)
              # 已存在，跳过以免覆盖
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=版本号未递增，已跳过发布::标签 v${VERSION} 已存在，为避免覆盖该版本已有的发布产物，本次跳过创建 Release。请递增 package.json 中的版本号后再提交。"
              ;;
            *)
              # 401/403/网络异常等：无法确认安全，按“已存在”处理并跳过，
              # 避免在不确定的状态下写入、把旧产物覆盖掉
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::warning title=无法确认标签状态，已跳过发布::查询 v${VERSION} 返回 HTTP ${status}，为避免误覆盖已跳过发布。"
              ;;
          esac

      - name: Download build artifact
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: dist-zip
          path: ./

      - name: Create GitHub Release
        id: create_release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./dist.zip
          generate_release_notes: true

  # 部署到 GitHub Pages
  # 只在两种情况下执行：
  #   1. push 到 main/master，且 HEAD 提交消息包含关键字 Deploy
  #   2. 手动触发并勾选 deploy_pages
  # 关键字区分大小写；只检查最后一次提交的消息。
  # 若希望日常 push 也更新线上，把下面的 contains(...) 条件删掉即可。
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
       contains(github.event.head_commit.message, 'Deploy')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
