name: Build, Release and Deploy

# 触发条件
on:
  # 推送到分支时触发（含 master 与 v*.*.* 标签）
  push:
    branches: [main, master, rebuild]
    tags: [v*.*.*]
  # PR 只做质量检查（lint + 单元测试），不构建、不发布
  pull_request:
    branches: [main, master, rebuild]
  # 手动触发，可勾选是否同时部署 Pages
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "同时部署到 GitHub Pages"
        required: false
        default: false
        type: boolean

# 环境变量
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # 唯一的构建入口：一次构建，产物供 release 与 deploy 复用
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 质量门禁：lint 与单元测试，失败即中止后续构建与发布
      # 注：不再包含 Prettier 检查。原 build-and-deploy.yml 里的
      # `pnpm run format -- --check` 实际会执行 `prettier --write ... --check`，
      # 其中 --check 被忽略，因此该步骤永远通过；真实的 `prettier --check src/`
      # 当前有约 100 个文件不通过（历史遗留）。要恢复严格检查，应先单独做一次
      # 全量格式化提交，再在此处加回 `prettier --check`。
      - name: Lint
        run: pnpm run lint:check

      - name: Unit tests
        run: pnpm run test:run

      # PR 到此为止：只做 lint 与单测，不构建产物
      - name: Build project
        if: github.event_name != 'pull_request'
        run: pnpm run build:full

      - name: Archive build files
        if: github.event_name != 'pull_request'
        run: |
          cd dist
          zip -r ../dist.zip ./*

      # Release 用 zip 包
      - name: Upload build artifact (zip)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: dist.zip
          retention-days: 30

      # Pages 部署需要目录形态的产物
      - name: Upload build artifact (directory)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 30

  # 发布到 GitHub Releases
  # push 到 main/master 或推送 v*.*.* 标签时无条件发布
  release:
    name: Release to GitHub
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-zip
          path: ./

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./dist.zip
          generate_release_notes: true

  # 部署到 GitHub Pages
  # 只在两种情况下执行：
  #   1. push 到 main/master，且 HEAD 提交消息包含关键字 Deploy
  #   2. 手动触发并勾选 deploy_pages
  # 关键字区分大小写；只检查最后一次提交的消息。
  # 若希望日常 push 也更新线上，把下面的 contains(...) 条件删掉即可。
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
       contains(github.event.head_commit.message, 'Deploy')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
