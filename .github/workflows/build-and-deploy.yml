name: Build and Deploy

# 触发条件
on:
  # 推送到main分支时触发
  push:
    branches: [main, master, rebuild]
  # 创建Pull Request时触发
  pull_request:
    branches: [main, master, rebuild]
  # 手动触发
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (production/staging)'
        required: false
        default: 'staging'
        type: choice
        options:
          - production
          - staging

# 环境变量
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # 代码质量检查和测试
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Prettier check
        run: pnpm run format -- --check

      - name: Run tests
        run: pnpm run test:run

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

  # 构建项目
  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 30

      - name: Build size analysis
        run: |
          echo "Build size analysis:"
          du -sh dist/
          echo "Detailed build contents:"
          find dist/ -type f -exec ls -lh {} \; | sort -k5 -hr

      - name: Archive build files
        run: |
          cd dist
          zip -r ../dist-1.0.0.zip ./*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: dist-1.0.0.zip
          retention-days: 30

  # 发布到GitHub Releases
  release:
    name: Release to GitHub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rebuild')

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-zip
          path: ./

      - name: Set Git commit name
        run: |
          # 设置Git提交名称，使用GitHub上下文信息或自定义名称
          GIT_USER_NAME="${{ github.actor }} (GitHub Actions)"
          GIT_USER_EMAIL="${{ github.actor }}@users.noreply.github.com"

          # 如果需要，可以从环境变量或工作流输入获取自定义名称
          # GIT_USER_NAME="${{ inputs.commit_name || github.actor }} (GitHub Actions)"
          # GIT_USER_EMAIL="${{ inputs.commit_email || github.actor }}@users.noreply.github.com"

          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"

          echo "已设置Git提交名称：$GIT_USER_NAME <$GIT_USER_EMAIL>"

      - name: Generate release notes
        id: generate_release_notes
        run: |
          # 生成当前提交的详细修改内容
          CHANGELOG=$(git log -1 --stat --pretty=format:"%h - %s%n%b%n%ad by %an" --date=short ${{ github.sha }})
          # 添加构建信息
          CHANGELOG="$CHANGELOG\n\n## 构建信息\n- 构建时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n- 构建编号: ${{ github.run_id }}\n- 构建触发事件: ${{ github.event_name }}\n- 触发分支: ${{ github.ref_name }}\n- 构建者: ${{ github.actor }}"
          # 设置为环境变量
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 1.0.0
          name: Release 1.0.0
          draft: false
          prerelease: false
          body: ${{ env.CHANGELOG }}
          files: |
            ./dist-1.0.0.zip
          generate_release_notes: true

      - name: Verify release
        run: |
          echo "Release created successfully!"
          echo "Release URL: ${{ steps.create_release.outputs.url }}"
          echo "Release ID: ${{ steps.create_release.outputs.id }}"

  # 部署到GitHub Pages
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/rebuild')

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
